<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The spokes stop short of the hub centre rather than meeting at it, so
       no mask is needed to keep the hub's hole open. With stroke-width 80 a
       round cap reaches 40 back past its endpoint, so starting at radius 80
       puts the innermost pixel at radius 40, outside the 37 hole. The hub
       ring covers 37 to 99, so the gap never shows. -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none" stroke-width="80">
    <path d="M512 473 L512 331"/>
    <path d="M442.7 593 L319 664"/>
    <path d="M581.3 593 L705 664"/>
  </g>
</svg>
